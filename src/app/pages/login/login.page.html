<ion-content [fullscreen]="true" class="login-content">

  <div class="brand-header">
    <p class="eyebrow">Bienvenido de nuevo</p>
    <h1 class="brand-title">Velvet &amp; Blade</h1>
    <p class="brand-sub">Barbería de Autor · Spa de Uñas</p>
  </div>

  <div class="form-wrap">
    <ion-item class="field-item" lines="none">
      <ion-label position="stacked">Correo electrónico</ion-label>
      <ion-input
        type="email"
        placeholder="tucorreo@ejemplo.com"
        [(ngModel)]="email"
        name="email">
      </ion-input>
    </ion-item>

    <ion-item class="field-item" lines="none">
      <ion-label position="stacked">Contraseña</ion-label>
      <ion-input
        type="password"
        placeholder="Contraseña"
        [(ngModel)]="password"
        name="password">
      </ion-input>
    </ion-item>

    <ion-text color="primary" *ngIf="errorMessage">
      <p class="error-msg">⚠ {{ errorMessage }}</p>
    </ion-text>

    <ion-button expand="block" color="primary" (click)="onLogin()">
      Iniciar sesión
    </ion-button>

    <p class="link-row">
      ¿Aún no tienes cuenta?
      <a (click)="goToRegister()">Regístrate</a>
    </p>
  </div>

</ion-content>
